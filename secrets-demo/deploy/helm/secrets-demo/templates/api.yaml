{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sd.apiSA" . }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sd.apiName" . }}
  labels: {app.kubernetes.io/name: {{ include "sd.apiName" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "sd.apiName" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sd.apiName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.api.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "sd.apiSA" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.api.initContainers }}
      initContainers: {{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- include "sd.podEnv" . | nindent 12 }}
            - {name: CONFIG_FILE, value: /etc/secrets-demo/config.yaml}
            {{- if .Values.spiffe.enabled }}
            - {name: SPIFFE_ENDPOINT_SOCKET, value: {{ include "sd.socket" . }}}
            {{- end }}
            {{- with .Values.api.env }}{{ tpl (toYaml .) $ | nindent 12 }}{{ end }}
          {{- $ef := .Values.api.envFrom }}
          {{- if or $ef (and .Values.demoSecret.enabled .Values.demoSecret.mountAsEnv) }}
          envFrom:
            {{- if and .Values.demoSecret.enabled .Values.demoSecret.mountAsEnv }}
            - prefix: DEMO_SECRET_
              secretRef: {name: {{ include "sd.name" . }}-demo}
            {{- end }}
            {{- with $ef }}{{ tpl (toYaml .) $ | nindent 12 }}{{ end }}
          {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/secrets-demo, readOnly: true}
            {{- if and .Values.demoSecret.enabled .Values.demoSecret.mountAsVolume }}
            - {name: demo-secret, mountPath: /secrets/k8s-volume, readOnly: true}
            {{- end }}
            {{- if .Values.spiffe.enabled }}
            - {name: spiffe-workload-api, mountPath: {{ .Values.spiffe.socketDir }}, readOnly: true}
            {{- end }}
            {{- with .Values.api.volumeMounts }}{{ tpl (toYaml .) $ | nindent 12 }}{{ end }}
        {{- with .Values.api.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "sd.apiName" . }}}
        {{- if and .Values.demoSecret.enabled .Values.demoSecret.mountAsVolume }}
        - name: demo-secret
          secret: {secretName: {{ include "sd.name" . }}-demo}
        {{- end }}
        {{- if .Values.spiffe.enabled }}
        {{- include "sd.spiffeVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.volumes }}{{ tpl (toYaml .) $ | nindent 8 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sd.apiName" . }}
  labels: {app.kubernetes.io/name: {{ include "sd.apiName" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: {{ include "sd.apiName" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if .Values.api.nodePort }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
