---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-demo-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-demo-web
---
apiVersion: v1
kind: Secret
metadata:
  name: secrets-demo-demo
type: Opaque
stringData: 
  API_KEY: demo-api-key-12345
  DB_PASSWORD: s3cr3t-from-k8s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-demo-api
  labels: {app.kubernetes.io/name: secrets-demo-api, app.kubernetes.io/instance: secrets-demo}
data:
  config.yaml: |
    appName: secrets-demo-api
    description: Secrets delivered as a plain Kubernetes Secret (env + volume)
    envPrefixes:
    - method: k8s-secret-env
      namePrefix: env/
      prefix: DEMO_SECRET_
    labels: {}
    scenario: k8s-secret
    secretDirs:
    - method: k8s-secret-volume
      namePrefix: volume/
      path: /secrets/k8s-volume
    secrets: []
    spiffe:
      allowedIds:
      - spiffe://example.org/ns/default/sa/secrets-demo-web
      audience: secrets-demo-api
      enabled: false
    watchIntervalMs: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-demo-web
  labels: {app.kubernetes.io/name: secrets-demo-web, app.kubernetes.io/instance: secrets-demo}
data:
  config.yaml: |
    apiUrl: http://secrets-demo-api:8080
    appName: secrets-demo-web
    description: ""
    labels: {}
    refreshIntervalMs: 5000
    scenario: k8s-secret
    spiffe:
      audience: secrets-demo-api
      enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-demo-api
  labels: {app.kubernetes.io/name: secrets-demo-api, app.kubernetes.io/instance: secrets-demo}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: secrets-demo-api, app.kubernetes.io/instance: secrets-demo}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-demo-web
  labels: {app.kubernetes.io/name: secrets-demo-web, app.kubernetes.io/instance: secrets-demo}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: secrets-demo-web, app.kubernetes.io/instance: secrets-demo}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo-api
  labels: {app.kubernetes.io/name: secrets-demo-api, app.kubernetes.io/instance: secrets-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: secrets-demo-api, app.kubernetes.io/instance: secrets-demo}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-demo-api
        app.kubernetes.io/instance: secrets-demo
      annotations:
        checksum/config: d48bd97ba1374031e9e61280f04bebf30f0a9cb4a4c68c69458cc0551025ef6d
    spec:
      serviceAccountName: secrets-demo-api
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "ghcr.io/wvanbesien/secrets-demo-api:add-secrets-demo"
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_SERVICE_ACCOUNT, valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}}
            - {name: CONFIG_FILE, value: /etc/secrets-demo/config.yaml}
          envFrom:
            - prefix: DEMO_SECRET_
              secretRef: {name: secrets-demo-demo}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: 
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - {name: config, mountPath: /etc/secrets-demo, readOnly: true}
            - {name: demo-secret, mountPath: /secrets/k8s-volume, readOnly: true}
      volumes:
        - name: config
          configMap: {name: secrets-demo-api}
        - name: demo-secret
          secret: {secretName: secrets-demo-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo-web
  labels: {app.kubernetes.io/name: secrets-demo-web, app.kubernetes.io/instance: secrets-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: secrets-demo-web, app.kubernetes.io/instance: secrets-demo}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-demo-web
        app.kubernetes.io/instance: secrets-demo
      annotations:
        checksum/config: d48bd97ba1374031e9e61280f04bebf30f0a9cb4a4c68c69458cc0551025ef6d
    spec:
      serviceAccountName: secrets-demo-web
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: "ghcr.io/wvanbesien/secrets-demo-web:add-secrets-demo"
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_SERVICE_ACCOUNT, valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}}
            - {name: CONFIG_FILE, value: /etc/secrets-demo/config.yaml}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: 
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - {name: config, mountPath: /etc/secrets-demo, readOnly: true}
      volumes:
        - name: config
          configMap: {name: secrets-demo-web}
