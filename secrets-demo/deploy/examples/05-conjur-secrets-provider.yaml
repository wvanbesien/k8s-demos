# Idira Secrets Manager / Conjur: Secrets Provider for Kubernetes as a sidecar in
# "push to file" mode, rewriting a file on refresh.
#
# STARTING POINT, NOT VERIFIED AGAINST A LIVE TENANT: the annotation names, image and
# connection variables follow the Conjur Secrets Provider docs; check them against the
# version you run, and replace every <placeholder>. You need the Conjur authenticator
# (authn-k8s or JWT), a host identity for the pod and a ConfigMap with the Conjur values.
scenario: conjur-push-to-file
demoSecret: {enabled: false}
api:
  podAnnotations:
    conjur.org/authn-identity: host/conjur/authn-k8s/<authenticator-id>/apps/<namespace>/service_account/<release>-api
    conjur.org/container-mode: sidecar
    conjur.org/secrets-destination: file
    conjur.org/conjur-secrets.app: |
      - db-password: <policy/path/to/db/password>
    conjur.org/secret-file-path.app: ./db-password
    conjur.org/secret-file-format.app: bash   # use "yaml"/"json"/"dotenv" to see structured output
    conjur.org/secrets-refresh-enabled: "true"
    conjur.org/secrets-refresh-interval: 10s
  volumes:
    - {name: conjur-secrets, emptyDir: {medium: Memory}}
    - {name: podinfo, downwardAPI: {items: [{path: annotations, fieldRef: {fieldPath: metadata.annotations}}]}}
  volumeMounts:
    - {name: conjur-secrets, mountPath: /conjur/secrets, readOnly: true}
  extraContainers:
    - name: cyberark-secrets-provider-for-k8s
      image: cyberark/secrets-provider-for-k8s:latest
      imagePullPolicy: Always
      env:
        - {name: MY_POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: MY_POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: CONJUR_AUTHN_LOGIN, value: host/conjur/authn-k8s/<authenticator-id>/apps/<namespace>/service_account/<release>-api}
        - {name: CONJUR_APPLIANCE_URL, value: https://<conjur-host>}
        - {name: CONJUR_AUTHN_URL, value: https://<conjur-host>/authn-k8s/<authenticator-id>}
        - {name: CONJUR_ACCOUNT, value: <account>}
        - name: CONJUR_SSL_CERTIFICATE
          valueFrom: {configMapKeyRef: {name: conjur-connect, key: ssl-certificate}}
      volumeMounts:
        - {name: podinfo, mountPath: /conjur/podinfo}
        - {name: conjur-secrets, mountPath: /conjur/secrets}
  config:
    description: Conjur Secrets Provider (sidecar, push-to-file)
    secrets: []
    secretDirs:
      - {path: /conjur/secrets, method: conjur-push-to-file}
    envPrefixes: []
