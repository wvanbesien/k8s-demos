# External Secrets Operator: syncs a Vault KV entry into a Kubernetes Secret, which the pod
# consumes as env (fixed at start) and as a volume (updated in place by the kubelet).
# Requires ESO installed; adjust the store (Vault shown) and its auth to your environment.
scenario: external-secrets-vault
demoSecret: {enabled: false}
api:
  envFrom:
    - prefix: DEMO_SECRET_
      secretRef: {name: "{{ .Release.Name }}-eso"}
  volumes:
    - name: eso
      secret: {secretName: "{{ .Release.Name }}-eso"}
  volumeMounts:
    - {name: eso, mountPath: /secrets/eso, readOnly: true}
  config:
    description: ESO (Vault) -> Kubernetes Secret -> env + volume
    secrets: []
    secretDirs:
      - {path: /secrets/eso, method: eso-k8s-secret-volume, namePrefix: "volume/"}
    envPrefixes:
      - {prefix: DEMO_SECRET_, method: eso-k8s-secret-env, namePrefix: "env/"}
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata: {name: "{{ .Release.Name }}-vault"}
    spec:
      provider:
        vault:
          server: http://vault.vault.svc:8200
          path: secret
          version: v2
          auth:
            kubernetes:
              mountPath: kubernetes
              role: secrets-demo
              serviceAccountRef: {name: "{{ .Release.Name }}-api"}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata: {name: "{{ .Release.Name }}-eso"}
    spec:
      refreshInterval: 15s
      secretStoreRef: {name: "{{ .Release.Name }}-vault", kind: SecretStore}
      target: {name: "{{ .Release.Name }}-eso"}
      data:
        - {secretKey: DB_PASSWORD, remoteRef: {key: secrets-demo/db, property: password}}
