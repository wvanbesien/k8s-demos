name: secrets-demo
on:
  pull_request:
    paths: ['secrets-demo/**', '.github/workflows/secrets-demo.yml']
  push:
    branches: [main]
    paths: ['secrets-demo/**', '.github/workflows/secrets-demo.yml']
    tags: ['secrets-demo-v*']

defaults:
  run:
    working-directory: secrets-demo

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "clippy, rustfmt"}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: secrets-demo}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {bin: secrets-demo-api}
          - {bin: secrets-demo-web}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.bin }}
          tags: |
            type=ref,event=branch
            type=match,pattern=secrets-demo-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: secrets-demo
          build-args: BIN=${{ matrix.bin }}
          push: true
          platforms: linux/amd64   # add linux/arm64 (slow under QEMU) if your nodes need it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bin }}

  chart:
    needs: images
    if: startsWith(github.ref, 'refs/tags/secrets-demo-v')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/secrets-demo
      - run: |
          V="${GITHUB_REF_NAME#secrets-demo-v}"
          helm package deploy/helm/secrets-demo --version "$V" --app-version "$V"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "secrets-demo-$V.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
